; Roomba cuadrícula — Propuesta S3 (ESP32-S3 + 2 × BTS7960 + encoders de cuadratura + MPU6050 + barredora)
; Compilar:        pio run -e esp32s3
; Subir firmware:  pio run -e esp32s3 -t upload
; Subir la web:    pio run -e esp32s3 -t uploadfs
; Monitor serie:   pio device monitor   (conecta el USB marcado "COM"/"UART" de la placa)
; Pruebas en PC:   pio test -e native

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0       ; Arduino-ESP32 2.0.17, versión fija
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0                    ; que el monitor no mueva EN/BOOT (evita reinicios en algunas placas)
monitor_dtr = 0
board_build.filesystem = littlefs
; Módulo ESP32-S3-WROOM-1 N16R8: 16 MB de flash (QIO) y 8 MB de PSRAM octal.
; La PSRAM NO se activa (el firmware no la necesita y en esta placa fallaba al iniciarla:
; "External RAM could not be added to heap"). Solo hay que no usar los GPIO 33–37.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
build_flags =
    -I include                     ; las librerías de lib/ también ven roomba_config.h
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DARDUINO_USB_CDC_ON_BOOT=0    ; Serial = UART0 (puerto "COM"). Pon 1 si solo usas el puerto "USB"
build_src_filter = +<*> -<diag/>
lib_deps =
    madhephaestus/ESP32Encoder@^0.11.8   ; cuadratura con PCNT (el S3 tiene 4 unidades)
    esp32async/ESPAsyncWebServer@^3.7.0  ; HTTP + WebSocket
    esp32async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.2.0
; La MPU6050 se lee con un controlador propio (lib/Mpu6050), sin biblioteca externa.

[env:diag]                         ; prueba de la placa sola: pio run -e diag -t upload
extends = env:esp32s3
build_src_filter = +<diag/>
lib_deps =
lib_ignore = Bts7960, Brush, QuadEncoder, Mpu6050, Pose, Motion, Safety, Mission, WebApi, Planner

[env:native]                       ; pruebas del planificador en la PC
platform = native
test_framework = unity
build_src_filter = -<*>
lib_compat_mode = off
lib_ignore = Bts7960, Brush, QuadEncoder, Mpu6050, Pose, Motion, Safety, Mission, WebApi
build_flags = -std=gnu++17 -I include
